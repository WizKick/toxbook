plugins { id 'com.android.application' }

android {
    namespace 'fr.toxbook'
    compileSdk 34

    defaultConfig {
        applicationId "fr.toxbook"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        release {
            storeFile file("../toxbook.keystore")
            storePassword "ChangeMoi2026"
            keyAlias "toxbook"
            keyPassword "ChangeMoi2026"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
